# -------------------------------------------------------
# Autostart applications
# -------------------------------------------------------
# Execute your favorite apps at launch
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# exec-once = waybar & hyprpaper & firefox
#exec-once = hyprpaper
exec-once = hyprlock
exec-once = waybar -l debug
exec-once = awww-daemon
exec-once = awww img $HOME/Images/Wallpapers/lonely-fish.png
# The package ships no polkit-kde-agent command, only this binary
exec-once = /usr/lib/polkit-kde-authentication-agent-1
# exec-once = systemctl --user start hyprpolkitagent
# Started explicitly so it owns the notification bus name, not Plasma's service
exec-once = dunst
exec-once = nm-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
# Theme is now sourced via theme.conf symlink in hyprland.conf

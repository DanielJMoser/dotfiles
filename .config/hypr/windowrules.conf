# -------------------------------------------------------
# Window rules
# -------------------------------------------------------
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Terminal
windowrule = opacity 0.7 0.7, match:class ^(kitty)$
windowrule = opacity 0.7 0.7, match:class ^(com.mitchellh.ghostty)$

# Browsers
windowrule = opacity 0.7 0.7, match:class ^(firefox)$

# Code
windowrule = opacity 0.7 0.7, match:class ^(Code - Insiders)$
# Matches both the XWayland class (VSCodium) and the native Wayland app_id
# (codium), so transparency survives the switch to --ozone-platform-hint.
windowrule = opacity 0.7 0.7, match:class ^([Cc]odium|VSCodium)$
windowrule = opacity 0.8 0.8, match:class ^(jetbrains-pycharm)$
windowrule = opacity 0.7 0.7, match:class ^(jetbrains-webstorm)$
windowrule = opacity 0.7 0.7, match:class ^(jetbrains-idea)$

# Sonstiges
windowrule = opacity 0.75 0.75, match:class ^(obsidian)$
windowrule = tile on, match:class ^(burp-StartBurp)$

# Games -- bypass compositing and allow tearing for lower input latency
windowrule = immediate on, match:class ^(cs2)$
windowrule = fullscreen on, match:class ^(cs2)$
windowrule = opacity 1.0 1.0, match:class ^(cs2)$
windowrule = no_blur on, match:class ^(cs2)$
windowrule = no_anim on, match:class ^(cs2)$
windowrule = idle_inhibit always, match:class ^(cs2)$

# -------------------------------------------------------
# Environment variables and XWayland
# -------------------------------------------------------
# Some default env vars.
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,hyprland
env = GDK_SCALE,1.5

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

# GPU
# Hardware video decode stays on the AMD iGPU -- it drives the internal panel
# (card1-eDP-1), so decoding there avoids a cross-GPU copy and saves power.
# The dGPU is reached per-process via prime-run, not via these.
env = LIBVA_DRIVER_NAME,radeonsi
env = VDPAU_DRIVER,radeonsi

# Electron apps (VSCodium, Obsidian, ...) pick Wayland when it is available
# and fall back to X11 otherwise. Without this they run under XWayland, which
# is unscaled here (force_zero_scaling), so they render tiny on the 1440p panel.
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Removed 2026-08-15 (backup: env.conf.bak-20260815-001926):
#   WLR_DRM_NO_ATOMIC / WLR_RENDERER_ALLOW_SOFTWARE
#     wlroots vars -- Hyprland 0.56 uses Aquamarine, so both were no-ops.
#   __GL_GSYNC_ALLOWED,0 / __GL_VRR_ALLOWED,0
#     disabled VRR on the 165 Hz panel. Defaults restored by omitting them.
#
# Removed 2026-09-29:
#   PATH,/usr/local/bin:/usr/bin:/bin
#     replaced the session PATH for everything Hyprland launches, so apps
#     started from wofi/binds lost rustup, the JVM, JetBrains Toolbox, etc.

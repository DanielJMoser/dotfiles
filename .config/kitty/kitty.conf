# vim:ft=kitty

## Kitty Configuration - Paste Crash Fixed
## Theme colors loaded from external file for easy switching

# ===== THEME (symlinked to active theme) =====
include theme.conf

# ===== FONTS =====
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        14.0

# Font features for better rendering
disable_ligatures never
font_features JetBrains-Mono +cv02 +cv03 +cv04 +ss01

# ===== CURSOR =====
cursor_shape            beam
cursor_beam_thickness   1.5
cursor_blink_interval   0.5
cursor_stop_blinking_after 15.0

# ===== URL STYLING =====
url_style               curly
detect_urls             yes

# ===== WINDOW BORDERS =====
window_border_width     1pt
window_margin_width     2
window_padding_width    4

# ===== TAB BAR =====
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        1
tab_switch_strategy     previous
tab_fade                0.25 0.5 0.75 1
tab_separator           ""
tab_bar_margin_width    0.0
tab_bar_margin_height   0.0 0.0
tab_title_template      " {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# ===== BELL =====
enable_audio_bell       no
visual_bell_duration    0.0
window_alert_on_bell    yes
bell_on_tab             yes
command_on_bell         none

# ===== PERFORMANCE =====
repaint_delay           10
input_delay             3
sync_to_monitor         yes

# ===== SCROLLBACK =====
scrollback_lines        2000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0
scrollback_fill_enlarged_window no
wheel_scroll_multiplier 5.0
wheel_scroll_min_lines  1
touch_scroll_multiplier 1.0

# ===== MOUSE & PASTE - CRASH-FREE CONFIGURATION =====
mouse_hide_wait         3.0
url_prefixes            file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls             yes
url_excluded_characters 
show_hyperlink_targets  yes
copy_on_select          no

# CRITICAL PASTE SETTINGS - PREVENTS ALL CRASHES
paste_actions           confirm
strip_trailing_spaces   never
select_by_word_characters @-./_~?&=%+#
click_interval          -1.0
focus_follows_mouse     no
pointer_shape_when_grabbed arrow
default_pointer_shape   beam
pointer_shape_when_dragging beam

# ===== CLIPBOARD - WAYLAND TIMEOUT FIX =====
clipboard_control       write-clipboard read-clipboard
clipboard_max_size      0
allow_hyperlinks        yes

# Wayland clipboard timeout fixes
wayland_titlebar_color  #1E1E2E
map ctrl+shift+v        paste_from_clipboard
map ctrl+shift+c        copy_to_clipboard

# ===== MISC =====
shell                   .
editor                  .
close_on_child_death    no
allow_remote_control    no
update_check_interval   24
startup_session         none
shell_integration       enabled
allow_cloning           ask
clone_source_strategies venv,conda,env_var,path

# ===== ADDITIONAL STABILITY SETTINGS =====
# Disable problematic features that can cause paste crashes
confirm_os_window_close 0
dynamic_background_opacity no
background_opacity      1.0
dim_opacity             0.75

# Memory and rendering optimizations
scrollback_pager_history_size 0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0